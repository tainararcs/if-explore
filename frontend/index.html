<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/inter-variable.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Recomendações de leitura do acervo da Biblioteca Roberval Cardoso – IF Sudeste MG, Campus Barbacena." />
    <meta name="theme-color" content="#F6F2E9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1A1D19" media="(prefers-color-scheme: dark)" />
    <title>IF Explore</title>
    <script>
      // Aplica o tema escolhido antes da renderização para evitar o flash de cores.
      try {
        var theme = localStorage.getItem('if-explore:theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
