# Backend CI workflow for push events to the backend directory or workflow files.
# This workflow validates the code by running Django's system checks, checking for
# missing migrations, and running the test suite (offline: no access to the PHL catalog).

name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: System check
        run: python manage.py check

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Test
        run: python manage.py test
